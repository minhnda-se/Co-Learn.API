name: Deploy CoLearn API to AWS ECS (deploy branch)

on:
  push:
    branches: [ "deploy" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials (assume role via OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push Docker image
      id: build-image
      env:
        ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      run: |
        IMAGE_TAG=deploy-${{ github.run_number }}
        IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
        echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_OUTPUT
        docker build -t $IMAGE_URI -f CoLearn.API/Dockerfile .
        docker push $IMAGE_URI

    - name: Get current task definition
      id: get-task-def
      run: |
        aws ecs describe-task-definition --task-definition CoLearnTask > taskdef.json
        cat taskdef.json

    - name: Register new task definition with new image
      id: register-task-def
      run: |
        IMAGE_URI=${{ steps.build-image.outputs.IMAGE_URI }}
        # build new task def JSON: replace container image, remove runtime fields
        jq --arg IMAGE "$IMAGE_URI" \
           '.taskDefinition
             | .containerDefinitions[0].image = $IMAGE
             | del(.taskDefinitionArn, .revision, .status, .registeredAt, .registeredBy)' taskdef.json > new-task-def.json
        cat new-task-def.json
        aws ecs register-task-definition --cli-input-json file://new-task-def.json > register-output.json
        echo "::set-output name=taskdef_arn::$(jq -r .taskDefinition.taskDefinitionArn register-output.json)"

    - name: Deploy new task definition to service
      run: |
        TASKDEF_ARN=$(jq -r .taskDefinition.taskDefinitionArn register-output.json)
        aws ecs update-service --cluster ${{ secrets.ECS_CLUSTER }} --service ${{ secrets.ECS_SERVICE }} --task-definition $TASKDEF_ARN --force-new-deployment

    - name: Wait for service stability
      run: |
        aws ecs wait services-stable --cluster ${{ secrets.ECS_CLUSTER }} --services ${{ secrets.ECS_SERVICE }}
